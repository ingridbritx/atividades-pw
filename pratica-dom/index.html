<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Prática DOM</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    header {
      background: #333;
      color: white;
      padding: 20px;
      position: fixed;
      top: 0;
      width: 100%;
      transition: background 0.3s ease;
    }

    main {
      margin-top: 100px;
    }
  </style>
</head>
<body>
  <header id="topo">Meu Header</header>
  <main id="conteudo"></main>
  <script src="script.js"></script>
</body>
</html>
